name: Multi-arch Docker Build with Build Cloud

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        default: "./Dockerfile"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG || secrets.DOCKERHUB_ORG || 'dxhltd' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'devxhublimited' }}
  DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT || 'dxhltd' }}
  CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME || 'devxhub' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cloud-builder-505117' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  DOCKERFILE_PATH: ${{ inputs.dockerfile_path || './Dockerfile' }}
  TARGET_PLATFORMS: ${{ vars.TARGET_PLATFORMS || github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
  RUNNER_GROUP: ${{ vars.RUNNER_GROUP || 'ci-builders' }}
  RUNNER_LABEL: ${{ vars.RUNNER_LABEL || 'vps-dokploy' }}

jobs:
  docker-build:
    # Prefer the self-hosted VPS; build cascade is local → Docker Build Cloud → GCloud.
    runs-on:
      group: ${{ vars.RUNNER_GROUP || 'ci-builders' }}
      labels:
        - ${{ vars.RUNNER_LABEL || 'vps-dokploy' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate image metadata
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            ENVIRONMENT="production"
            TAG_SUFFIX="prod"
            IMAGE_DESC="Production multi-arch Next.js application"
          else
            ENVIRONMENT="development"
            TAG_SUFFIX="$BRANCH_NAME"
            IMAGE_DESC="Development multi-arch Next.js application"
          fi

          TAGS="${{ env.DOCKERHUB_ORG }}/${REPO_NAME}:${TAG_SUFFIX}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_ORG }}/${REPO_NAME}:latest"
          fi

          echo "image-name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "tag-suffix=${TAG_SUFFIX}" >> $GITHUB_OUTPUT
          echo "description=${IMAGE_DESC}" >> $GITHUB_OUTPUT

      - name: Validate Dockerfile
        run: |
          if [[ ! -f "${{ env.DOCKERFILE_PATH }}" ]]; then
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx (local)
        id: local_buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: devxhub-builder
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "10GB"
              maxUsedSpace = "30GB"
              minFreeSpace = "20%"

      - name: Select local Buildx builder
        run: docker buildx use nudova-builder

      - name: Build and push (self-hosted local)
        id: local_build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          builder: ${{ steps.local_buildx.outputs.name }}
          platforms: ${{ env.TARGET_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.short-sha }}
            PROJECT_NAME=${{ steps.meta.outputs.image-name }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image-name }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short-sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx (Build Cloud fallback)
        id: cloud_buildx
        if: steps.local_build.outcome != 'success'
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: ${{ env.DOCKER_ACCOUNT }}/${{ env.CLOUD_BUILDER_NAME }}

      - name: Build and push (Build Cloud fallback)
        id: cloud_build
        if: steps.local_build.outcome != 'success'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          builder: ${{ steps.cloud_buildx.outputs.name }}
          platforms: ${{ env.TARGET_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.short-sha }}
            PROJECT_NAME=${{ steps.meta.outputs.image-name }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image-name }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short-sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Authenticate to Google Cloud (fallback)
        if: steps.local_build.outcome != 'success' && steps.cloud_build.outcome != 'success'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK (fallback)
        if: steps.local_build.outcome != 'success' && steps.cloud_build.outcome != 'success'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build with Google Cloud Build (fallback)
        if: steps.local_build.outcome != 'success' && steps.cloud_build.outcome != 'success'
        run: |
          RAW_TAGS="${{ steps.meta.outputs.tags }}"
          SPACE_TAGS="${RAW_TAGS//,/ }"

          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --substitutions="^;^_DOCKERFILE_PATH=${{ env.DOCKERFILE_PATH }};_TARGET_PLATFORMS=${{ env.TARGET_PLATFORMS }};_BUILD_VERSION=${{ steps.meta.outputs.short-sha }};_IMAGE_TAGS=$SPACE_TAGS" \
            --project=${{ env.GCP_PROJECT_ID }} \
            --suppress-logs

      - name: Fail if all build methods exhausted
        if: steps.local_build.outcome != 'success' && steps.cloud_build.outcome != 'success' && failure()
        run: exit 1
